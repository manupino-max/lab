name: Public Actions Test

on:
  push:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test stack
        run: python -m pip install 'numpy==1.26.4' 'pandas==2.2.3' 'scikit-learn==1.5.2' pytest
      - name: Run independent M4 unit tests
        run: pytest -q tests/test_m4_mean_line.py
      - name: Check runner
        run: |
          echo "GitHub Actions public runner is working"
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Run: $GITHUB_RUN_ID"
