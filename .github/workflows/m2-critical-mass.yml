name: M2 Critical Mass DeltaMu
on:
  push:
    paths:
      - 'experiments/m2_critical_mass_deltamu.py'
      - '.github/workflows/m2-critical-mass.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  critical_mass:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade numpy scipy scikit-learn pandas
      - name: Run M2 critical-mass experiment
        run: python experiments/m2_critical_mass_deltamu.py
      - name: Validate artifacts
        run: |
          test -s results/m2_critical_mass_deltamu/results.csv
          test -s results/m2_critical_mass_deltamu/summary.json
      - name: Upload M2 evidence
        uses: actions/upload-artifact@v4
        with:
          name: M2-critical-mass-deltamu-${{ github.sha }}
          path: results/m2_critical_mass_deltamu/
          retention-days: 90
