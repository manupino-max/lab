name: M4 canonical LEACE replication

on:
  push:
    paths:
      - 'experiments/leace_canonical_replication.py'
      - '.github/workflows/m4-leace-canonical-replication.yml'
  pull_request:
    paths:
      - 'experiments/leace_canonical_replication.py'
      - '.github/workflows/m4-leace-canonical-replication.yml'
  workflow_dispatch:

jobs:
  leace-replication:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned scientific dependencies
        run: |
          python -m pip install --upgrade pip
          pip install 'numpy==1.26.4' 'scipy==1.13.1' 'scikit-learn==1.5.2' 'torch==2.4.1' 'concept-erasure==0.2.1'
      - name: Capture environment
        run: |
          python --version
          pip freeze | tee environment.txt
      - name: Run canonical LEACE clean-room replication
        run: python experiments/leace_canonical_replication.py
      - name: Upload auditable evidence
        uses: actions/upload-artifact@v4
        with:
          name: m4-leace-canonical-replication-${{ github.sha }}
          path: |
            experiments/results/leace_canonical_replication/
            environment.txt
          if-no-files-found: error
