name: M4 LEACE-CL independent test

on:
  push:
    paths:
      - 'experiments/m4_leace_cl.py'
      - 'testing/m4_leace_cl_spec.md'
      - '.github/workflows/test_m4_leace_cl.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy==1.26.4
      - name: Independent mathematical test
        run: python experiments/m4_leace_cl.py
