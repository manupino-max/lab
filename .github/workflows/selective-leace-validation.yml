name: Selective-LEACE validation

on:
  workflow_dispatch:
    inputs:
      eps_auc:
        description: 'Frozen EPS_AUC (required; do not guess)'
        required: true
        type: string
      eps_ba:
        description: 'Frozen EPS_BA (required; do not guess)'
        required: true
        type: string

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements-selective-leace.txt

      - name: Protocol smoke checks
        run: |
          python -m py_compile experiments/selective_leace_validation_v1.py
          python -m pytest -q experiments/test_selective_leace_validation.py

      - name: Run 20-seed validation
        run: |
          python experiments/selective_leace_validation_v1.py \
            --eps-auc '${{ inputs.eps_auc }}' \
            --eps-ba '${{ inputs.eps_ba }}' \
            --out results/selective_leace_validation

      - name: Upload auditable results
        uses: actions/upload-artifact@v4
        with:
          name: selective-leace-validation-${{ github.run_id }}
          path: results/selective_leace_validation/
          if-no-files-found: error
