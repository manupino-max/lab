name: M4 Pi-Fi Public Smoke
on:
  push:
    paths:
      - 'experiments/M4_PiFi_public_smoke.py'
      - '.github/workflows/m4-pifi-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --disable-pip-version-check numpy scikit-learn
      - run: python -m py_compile experiments/M4_PiFi_public_smoke.py
      - run: python experiments/M4_PiFi_public_smoke.py
      - uses: actions/upload-artifact@v4
        with:
          name: m4-pifi-smoke-${{ matrix.python }}
          path: experiments/results/pifi_smoke/
