name: M2 LEACE Sparse Pareto
on:
  push:
    paths:
      - experiments/m2_leace_sparse_pareto_20260814.py
      - .github/workflows/m2-leace-sparse-pareto.yml
jobs:
  sparse_pareto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install concept-erasure scikit-learn scipy numpy torch
      - name: Run experiment
        run: python experiments/m2_leace_sparse_pareto_20260814.py
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: M2_LEACE_SPARSE_PARETO_20260814
          path: results/M2_LEACE_SPARSE_PARETO_20260814/
